# Uygulamanın adı. Loglarda görünür.
spring.application.name=till-midnight-api
# Veritabanı adresi. ${A:B}: A ortam değişkeni varsa onu, yoksa B'yi kullan.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/tillmidnight}
# Veritabanı kullanıcısı.
spring.datasource.username=${DB_USERNAME:tillmidnight}
# Veritabanı şifresi. Yayında ortam değişkeninden gelecek.
spring.datasource.password=${DB_PASSWORD:tillmidnight}
