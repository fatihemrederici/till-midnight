# Testlerde bu dosya kullanılır. Testler kendi "test" şemasında çalışır, gerçek veriye dokunmaz.
spring.application.name=till-midnight-api-test
# Aynı veritabanı, ama test şeması.
spring.datasource.url=jdbc:postgresql://localhost:5433/tillmidnight?currentSchema=test
# Veritabanı kullanıcısı.
spring.datasource.username=tillmidnight
# Veritabanı şifresi.
spring.datasource.password=tillmidnight
# Flyway tabloları test şemasında oluştursun.
spring.flyway.default-schema=test
