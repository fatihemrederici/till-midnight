# Testlerde bu dosya kullanılır. Testler kendi "test" şemasında çalışır, gerçek veriye dokunmaz.
spring.application.name=10sec-api-test
# Aynı veritabanı, ama test şeması.
spring.datasource.url=jdbc:postgresql://localhost:5433/tensec?currentSchema=test
# Veritabanı kullanıcısı.
spring.datasource.username=tensec
# Veritabanı şifresi.
spring.datasource.password=tensec
# Flyway tabloları test şemasında oluştursun.
spring.flyway.default-schema=test