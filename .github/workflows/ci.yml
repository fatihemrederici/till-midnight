# Her push ve pull request'te sunucu ve oyun testleri çalışır.
name: CI

on:
  push:
  pull_request:

jobs:
  # Java sunucusu: Bölüm kuralları, motor, analiz ve API testleri.
  api:
    runs-on: ubuntu-latest
    services:
      # Testlerin kullandığı veritabanı, yerelde docker compose ile aynı ayarlarla.
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tillmidnight
          POSTGRES_USER: tillmidnight
          POSTGRES_PASSWORD: tillmidnight
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tillmidnight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B test

  # React oyunu: Motor testleri ve derleme.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
